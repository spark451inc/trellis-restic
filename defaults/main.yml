---
# Update the version and compressed-artifact checksums together.
restic_backup_version: "0.19.1"
restic_backup_checksums:
  amd64: sha256:f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
  arm64: sha256:a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465

restic_backup_enabled: true

# Existing S3 destination. The repository path is <stack>/<env>.
restic_backup_s3_bucket: ""
restic_backup_s3_region: ""
restic_backup_stack_name: ""

# Passwordless repositories expose their contents to every principal with S3
# read access. This must be explicitly acknowledged in inventory.
restic_backup_insecure_no_password: false
restic_backup_initialize: false

# Site selection and paths
restic_backup_excluded_sites: []
restic_backup_uploads_paths: {}

# Patterns are relative to a site's uploads path and are expanded to absolute
# patterns so a site's exclusions cannot affect another site.
restic_backup_excludes: []
restic_backup_site_excludes: {}

# systemd timer schedule
restic_backup_on_calendar:
  - "*-*-* 00:00:00"
  - "*-*-* 06:00:00"
  - "*-*-* 12:00:00"
  - "*-*-* 18:00:00"
restic_backup_randomized_delay_sec: 30m

# Runtime controls
restic_backup_runtime_max_sec: 5h
restic_backup_nice: 10
restic_backup_io_scheduling_class: best-effort
restic_backup_io_scheduling_priority: 7
restic_backup_memory_max: ""
restic_backup_limit_upload_kib: 0
restic_backup_s3_connections: 0

# Optional Uptime Kuma push monitor URL.
restic_backup_uptime_kuma_push_url: ""
